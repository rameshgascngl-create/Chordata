name: CHORDATA — correct Calotes arterial label in isolated QA
on:
  push:
    branches: ["qa/chordata-illustrations-continuous"]
    paths:
      - ".github/workflows/qa-repair-calotes-arterial-label.yml"
      - "scripts/repair_calotes_arterial_label.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  correct-registered-figure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic PNG renderer
        run: python -m pip install CairoSVG==2.8.2
      - name: Correct label in SVG and regenerate exactly one PNG
        run: python3 scripts/repair_calotes_arterial_label.py
      - name: Validate 64 registered figures, SHA-256 and provenance
        run: |
          python3 scripts/audit_figure_placement.py
          python3 scripts/audit_pencil_coverage.py
          python3 scripts/audit_coverage_report.py
          python3 scripts/write_figure_review_register.py --check
          python3 scripts/check_textbook_plates.py
          git diff --check
      - name: Commit the corrected PNG and reviewer ledger on QA only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/pencil_plates/calotes_heart_arteries_en.png
          git add app/src/main/assets/pencil_plates/manifest.json
          git add docs/original_plate_svg/calotes_heart_arteries_en.svg
          git add docs/FIGURE_REVIEW_REGISTER_64.csv
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git diff --cached --check
            git diff --cached --stat
            git commit -m "fix(qa): correct Calotes inter-cavity flow label and raster PNG"
            git push origin HEAD:qa/chordata-illustrations-continuous
          fi
