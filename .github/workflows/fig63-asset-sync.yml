name: One-time Figure 63 registered PNG correction
on:
  push:
    branches:
      - qa/chordata-textbook-unit2-continuation-20261113
    paths:
      - .github/fig63-sync-request-20261120.txt
permissions:
  contents: read
jobs:
  integrate-fig63:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic figure tool
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Draw correct registered PNG and invalidate old QA hash
        run: python scripts/build_fig63_plate.py
      - name: Regenerate independent-approval register without fabricating sign-offs
        run: python scripts/write_figure_review_register.py
      - name: Confirm image structure, counts and scientific/owner-review safeguards
        run: |
          python scripts/audit_figure_placement.py
          python scripts/audit_pencil_coverage.py
          python scripts/write_figure_review_register.py --check
      - name: Commit exact PNG, SHA, provenance and register changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/pencil_plates/human_rabbit_dental_formula.png
          git add app/src/main/assets/pencil_plates/manifest.json
          git add docs/FIGURE_REVIEW_REGISTER_64.csv docs/figures/retired_fig63_20261120.png
          git diff --cached --exit-code && { echo 'ERROR: Figure correction created no changes'; exit 1; } || true
          git commit -m 'fix(fig63): integrate posterior peg-tooth inset and reset review hash'
          git push origin HEAD:refs/heads/qa/chordata-textbook-unit2-continuation-20261113
