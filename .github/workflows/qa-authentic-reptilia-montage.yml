name: CHORDATA QA - authentic licensed Reptilia photo montage
on:
  push:
    branches: ["qa/chordata-authentic-reptilia-20261109"]
    paths:
      - "scripts/install_authentic_reptilia_montage.py"
      - ".github/workflows/qa-authentic-reptilia-montage.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  authentic-reptilia-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JPEG to PNG decoder
        run: python3 -m pip install Pillow==11.3.0
      - name: Compile strict source-intake script
        run: python3 -m py_compile scripts/install_authentic_reptilia_montage.py
      - name: Verify exact licensed Wikimedia JPEG and integrate its unchanged pixels
        run: python3 scripts/install_authentic_reptilia_montage.py
      - name: Audit 64 lesson placements, all PNG hashes, reviews and source attributions
        run: bash scripts/qa_all.sh
      - name: Update read-only provenance inventory for all 64 figures
        run: python3 scripts/report_artwork_provenance.py
      - name: Ensure only Reptilia plate and corresponding provenance metadata changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed={
            'app/src/main/assets/pencil_plates/living_reptile_groups_en.png',
            'app/src/main/assets/pencil_plates/manifest.json',
            'docs/figure-coverage.tsv',
            'docs/FIGURE_REVIEW_REGISTER_64.csv',
            'docs/CHORDATA_REPTILIA_2012_PHOTOGRAPHIC_MONTAGE_QA.md',
            'docs/CHORDATA_ARTWORK_PROVENANCE_AUDIT_64.md',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          affected=changed|untracked
          if not affected or not affected<=allowed:
              raise SystemExit('Refusing to commit unexpected/missing QA files: '+str(sorted(affected-allowed)))
          print('PASS only allowed Reptilia and metadata paths changed:',sorted(affected))
          PY
      - name: Commit source-authentic Reptilia PNG on isolated QA branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/pencil_plates/living_reptile_groups_en.png
          git add app/src/main/assets/pencil_plates/manifest.json
          git add docs/figure-coverage.tsv docs/FIGURE_REVIEW_REGISTER_64.csv
          git add docs/CHORDATA_REPTILIA_2012_PHOTOGRAPHIC_MONTAGE_QA.md
          git add docs/CHORDATA_ARTWORK_PROVENANCE_AUDIT_64.md
          git diff --cached --check
          test ! -z "$(git diff --cached --name-only)"
          git commit -m "assets(qa): stage authentic CC-licensed reptile groups montage"
          git push origin HEAD:qa/chordata-authentic-reptilia-20261109
      - name: Upload exact source and attribution as QA-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Chordata_Reptilia_Montage_Source_QA
          path: |
            app/src/main/assets/pencil_plates/living_reptile_groups_en.png
            docs/CHORDATA_REPTILIA_2012_PHOTOGRAPHIC_MONTAGE_QA.md
            docs/CHORDATA_ARTWORK_PROVENANCE_AUDIT_64.md
          if-no-files-found: warn
          retention-days: 14
