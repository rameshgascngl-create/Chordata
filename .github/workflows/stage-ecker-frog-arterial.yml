name: Chordata Ecker frog arterial anatomy — isolated QA
on:
  push:
    branches: ["qa/chordata-frog-arteries-20261107"]
    paths:
      - ".github/workflows/stage-ecker-frog-arterial.yml"
      - "scripts/stage_ecker_frog_arterial.py"
      - "scripts/audit_figure_placement.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reproducible figure processing dependencies
        run: python -m pip install Pillow==11.3.0 beautifulsoup4==4.14.2
      - name: Retrieve exact 1889 Fig. 143 and prepare offline frog artery plate
        run: python3 scripts/stage_ecker_frog_arterial.py
      - name: Verify all 64 figure placements and scientific approval holds
        run: bash scripts/qa_all.sh
      - name: Commit source-credited provisional artwork on QA branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/pencil_plates/frog_arterial_system_en.png
          git add app/src/main/assets/pencil_plates/manifest.json
          git add docs/figure-coverage.tsv docs/FIGURE_REVIEW_REGISTER_64.csv
          git add docs/CHORDATA_ECKER_FROG_ARTERIAL_QA.md
          git add docs/qa-image-review/frog_arterial_system_review.png
          if git diff --cached --quiet; then
            echo "Frog arterial anatomy already current"
          else
            git diff --cached --stat
            git commit -m "assets(qa): stage Ecker 1889 frog artery anatomy and readable English key"
            git push origin HEAD:qa/chordata-frog-arteries-20261107
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android API 37 SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          printf 'y\n' | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-37.0' 'build-tools;36.0.0'
          bash scripts/verify_sdk37_platform.sh
      - name: Build the native debug QA APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Audit image SHA-256 inside built APK
        run: python3 scripts/audit_built_apk_assets.py app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK for academic QA only
        uses: actions/upload-artifact@v4
        with:
          name: Chordata_Ecker_Frog_Arterial_QA_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      - name: Preserve source evidence and visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Chordata_Ecker_Frog_Arterial_Review
          path: |
            docs/qa-image-review/frog_arterial_system_review.png
            docs/CHORDATA_ECKER_FROG_ARTERIAL_QA.md
          retention-days: 14
          if-no-files-found: warn
