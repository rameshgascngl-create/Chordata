name: CHORDATA Wave 7 — authentic historical brain PNG intake (QA)
on:
  push:
    branches: ["qa/chordata-original-png-intake-20261107"]
    paths:
      - "scripts/stage_historical_dogfish_brain_png_wave7.py"
      - "scripts/audit_figure_placement.py"
      - ".github/workflows/stage-historical-brain-png-wave7.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-integrity-compile-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned PNG decoder (no drawing or image generation)
        run: python3 -m pip install Pillow==11.3.0
      - name: Download source-authentic PD PNG and require immutable SHA-1
        run: python3 scripts/stage_historical_dogfish_brain_png_wave7.py
      - name: Validate source, 64 figures, review status and APK checks
        run: bash scripts/qa_all.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install Android SDK for Kotlin native compilation
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          printf 'y\n' | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-37.0' 'build-tools;36.0.0'
          bash scripts/verify_sdk37_platform.sh
      - name: Compile native Kotlin against sourced offline PNGs
        run: gradle --no-daemon :app:compileDebugKotlin
      - name: Commit only original source PNG and its exact provenance
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/pencil_plates/shark_brain_dorsal_en.png
          git add app/src/main/assets/pencil_plates/manifest.json
          git add docs/figure-coverage.tsv docs/FIGURE_REVIEW_REGISTER_64.csv
          git add docs/CHORDATA_BRAIN_HISTORICAL_PNG_INTAKE_QA.md
          if ! git diff --cached --quiet; then
            git diff --cached --stat
            git commit -m "assets(qa): replace generated brain drawing with authentic Fritsch PD PNG"
            git push origin HEAD:qa/chordata-original-png-intake-20261107
          else
            echo "The verified source PNG is already committed"
          fi
      - name: Upload unmodified historical source for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Chordata_Historical_Dogfish_Brain_PNG_Review
          path: |
            app/src/main/assets/pencil_plates/shark_brain_dorsal_en.png
            docs/CHORDATA_BRAIN_HISTORICAL_PNG_INTAKE_QA.md
          if-no-files-found: warn
          retention-days: 14
