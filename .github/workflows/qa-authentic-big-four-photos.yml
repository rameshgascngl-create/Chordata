name: CHORDATA QA - authentic licensed Big Four snake photographs
on:
  push:
    branches: ["qa/chordata-big-four-licensed-photos-20261109"]
    paths:
      - "scripts/install_authentic_big_four_snakes.py"
      - ".github/workflows/qa-authentic-big-four-photos.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  authentic-big-four-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install original-photo decoder
        run: python3 -m pip install Pillow==11.3.0
      - name: Compile source-intake script
        run: python3 -m py_compile scripts/install_authentic_big_four_snakes.py
      - name: Verify four original licensed Commons JPEGs and compose PNG
        run: python3 scripts/install_authentic_big_four_snakes.py
      - name: Audit 64 lesson placements, all registered PNG hashes, reviews and rights
        run: bash scripts/qa_all.sh
      - name: Update artwork provenance inventory for all 64 figures
        run: python3 scripts/report_artwork_provenance.py
      - name: Reject unexpected changes and whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed={
            'app/src/main/assets/pencil_plates/india_big_four_snakes_en.png',
            'app/src/main/assets/pencil_plates/manifest.json',
            'docs/figure-coverage.tsv',
            'docs/FIGURE_REVIEW_REGISTER_64.csv',
            'docs/CHORDATA_BIG_FOUR_AUTHENTIC_PHOTOS_QA_20261109.md',
            'docs/CHORDATA_ARTWORK_PROVENANCE_AUDIT_64.md',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          affected=changed|untracked
          if not affected or not affected<=allowed:
              raise SystemExit('Refusing unexpected or missing changed paths: '+str(sorted(affected-allowed)))
          print('PASS exact Big Four PNG/provenance files only:',sorted(affected))
          PY
      - name: Commit validated four original photographs on isolated QA branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/pencil_plates/india_big_four_snakes_en.png
          git add app/src/main/assets/pencil_plates/manifest.json
          git add docs/figure-coverage.tsv docs/FIGURE_REVIEW_REGISTER_64.csv
          git add docs/CHORDATA_BIG_FOUR_AUTHENTIC_PHOTOS_QA_20261109.md
          git add docs/CHORDATA_ARTWORK_PROVENANCE_AUDIT_64.md
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "assets(qa): replace Big Four silhouettes with four credited live-snake photos"
          git push origin HEAD:qa/chordata-big-four-licensed-photos-20261109
      - name: Archive exact Big Four QA PNG and source credits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Chordata_Big_Four_Licensed_Photos_QA
          path: |
            app/src/main/assets/pencil_plates/india_big_four_snakes_en.png
            docs/CHORDATA_BIG_FOUR_AUTHENTIC_PHOTOS_QA_20261109.md
            docs/CHORDATA_ARTWORK_PROVENANCE_AUDIT_64.md
          if-no-files-found: warn
          retention-days: 14
