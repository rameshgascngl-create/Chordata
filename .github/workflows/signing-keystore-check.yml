name: CHORDATA secure publisher keystore verification

on:
  workflow_dispatch:
  push:
    branches:
      - qa/chordata-textbook-unit2-continuation-20261113
    paths:
      - .github/workflows/signing-keystore-check.yml

permissions:
  contents: read

jobs:
  verify-publisher-keystore:
    name: Verify encrypted publisher secrets without publishing a release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: play-upload-review
    steps:
      - name: Set up Java signing tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate keystore, alias and both signing passwords
        shell: bash
        env:
          CHORDATA_KEYSTORE_B64: ${{ secrets.CHORDATA_PLAY_UPLOAD_KEYSTORE_B64 }}
          CHORDATA_STORE_PASSWORD: ${{ secrets.CHORDATA_PLAY_UPLOAD_STORE_PASSWORD }}
          CHORDATA_KEY_ALIAS: ${{ secrets.CHORDATA_PLAY_UPLOAD_KEY_ALIAS }}
          CHORDATA_KEY_PASSWORD: ${{ secrets.CHORDATA_PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for name in CHORDATA_KEYSTORE_B64 CHORDATA_STORE_PASSWORD CHORDATA_KEY_ALIAS CHORDATA_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing encrypted environment secret: $name"
              exit 1
            fi
          done

          key="$RUNNER_TEMP/chordata-publisher-keycheck.jks"
          scratch="$RUNNER_TEMP/chordata-signing-check.txt"
          unsigned="$RUNNER_TEMP/chordata-signing-check-unsigned.jar"
          signed="$RUNNER_TEMP/chordata-signing-check-signed.jar"
          trap 'rm -f "$key" "$scratch" "$unsigned" "$signed"' EXIT

          printf '%s' "$CHORDATA_KEYSTORE_B64" | base64 --decode > "$key"
          test -s "$key"
          keytool -list -keystore "$key" \
            -storepass:env CHORDATA_STORE_PASSWORD \
            -alias "$CHORDATA_KEY_ALIAS" >/dev/null

          # Sign a disposable non-Android JAR to prove that the private key and
          # key password are usable. No APK, AAB, keystore or private key is uploaded.
          printf 'CHORDATA keystore validation only\n' > "$scratch"
          jar --create --file "$unsigned" -C "$RUNNER_TEMP" "$(basename "$scratch")"
          jarsigner -keystore "$key" \
            -storepass:env CHORDATA_STORE_PASSWORD \
            -keypass:env CHORDATA_KEY_PASSWORD \
            -signedjar "$signed" "$unsigned" "$CHORDATA_KEY_ALIAS" >/dev/null
          jarsigner -verify "$signed" >/dev/null

          # Public certificate fingerprint only: safe for a release audit record.
          keytool -list -v -keystore "$key" \
            -storepass:env CHORDATA_STORE_PASSWORD \
            -alias "$CHORDATA_KEY_ALIAS" | grep -E 'Entry type:|SHA256:'
          echo 'PASS: publisher keystore, alias, store password and key password are valid.'
          echo 'No release artifact was built and no private signing material was published.'
