name: Chordata avian respiratory anatomy — isolated QA
on:
  push:
    branches: ["qa/chordata-bird-respiration-20261107"]
    paths:
      - ".github/workflows/stage-bird-respiration.yml"
      - "scripts/stage_public_domain_bird_respiration.py"
      - "scripts/audit_figure_placement.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned rasterisation libraries
        run: python -m pip install Pillow==11.3.0 CairoSVG==2.8.2
      - name: Render the original public-domain SVG into a high-resolution PNG
        run: python3 scripts/stage_public_domain_bird_respiration.py
      - name: Check all 64 exact placements, provenance, and non-approval
        run: bash scripts/qa_all.sh
      - name: Commit the new English-labelled image and its complete source record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/pencil_plates/avian_respiration_en.png
          git add app/src/main/assets/pencil_plates/manifest.json
          git add docs/figure-coverage.tsv docs/FIGURE_REVIEW_REGISTER_64.csv
          git add docs/CHORDATA_AVIAN_RESPIRATION_SOURCE_QA.md
          git add docs/qa-image-review/avian_respiration_review.png
          if git diff --cached --quiet; then
            echo "Avian figure unchanged, no new commit"
          else
            git diff --cached --stat
            git commit -m "assets(qa): replace provisional avian lungs with public-domain airflow plate"
            git push origin HEAD:qa/chordata-bird-respiration-20261107
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android API 37 SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          printf 'y\n' | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-37.0' 'build-tools;36.0.0'
          bash scripts/verify_sdk37_platform.sh
      - name: Build native Android QA APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Audit the actual APK for all 64 figure assets and hashes
        run: python3 scripts/audit_built_apk_assets.py app/build/outputs/apk/debug/app-debug.apk
      - name: Upload the non-production QA Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Chordata_Avian_Respiration_QA_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload the diagram visual review screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Chordata_Avian_Respiration_Review
          path: |
            docs/qa-image-review/avian_respiration_review.png
            docs/CHORDATA_AVIAN_RESPIRATION_SOURCE_QA.md
          if-no-files-found: warn
          retention-days: 14
