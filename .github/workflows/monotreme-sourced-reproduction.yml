name: CHORDATA monotreme source-anatomy replacement QA
on:
  push:
    branches: ["qa/chordata-monotreme-reproduction-sourced-20261112"]
    paths:
      - "scripts/install_monotreme_sourced_reproduction.py"
      - "scripts/audit_figure_placement.py"
      - ".github/workflows/monotreme-sourced-reproduction.yml"
permissions:
  contents: write
jobs:
  install-sourced-monotreme:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image-original metadata and lossless rendering tools
        run: python3 -m pip install --disable-pip-version-check --quiet "Pillow>=10,<12" "requests>=2.32,<3"
      - name: Verify Wikimedia licensing and prepare species-specific teaching image
        run: python3 scripts/install_monotreme_sourced_reproduction.py
      - name: Audit offline assets, original PNG archive, 64 lesson slots and credits
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/retired_noninstructional_png/platypus_reproduction.png
          test -f docs/qa-image-review/MONOTREME_REPRODUCTION_SOURCE_PLATE_20261112.json
          python3 scripts/audit_figure_placement.py
          python3 scripts/audit_pencil_coverage.py
          python3 scripts/audit_coverage_report.py
          python3 scripts/audit_android_qa_contract.py
          python3 scripts/test_review_signoff_guards.py
          python3 scripts/audit_built_apk_assets.py --self-test
          python3 scripts/write_figure_review_register.py --check
      - name: Commit exact sourced image and complete credit evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/pencil_plates/platypus_reproduction.png
          git add app/src/main/assets/pencil_plates/manifest.json
          git add docs/retired_noninstructional_png/platypus_reproduction.png
          git add docs/qa-image-review/MONOTREME_REPRODUCTION_SOURCE_PLATE_20261112.json
          git add docs/figure-coverage.tsv docs/FIGURE_REVIEW_REGISTER_64.csv
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(monotreme): replace symbolic reproductive plate with verified photographs and published anatomy"
          git push origin HEAD:qa/chordata-monotreme-reproduction-sourced-20261112
