name: Chordata historical rabbit brain — isolated QA
on:
  push:
    branches: ["qa/chordata-rabbit-brain-20261107"]
    paths:
      - ".github/workflows/stage-rabbit-brain-1875.yml"
      - "scripts/stage_historical_rabbit_brain.py"
      - "scripts/audit_figure_placement.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned SVG rasterisation libraries
        run: python -m pip install Pillow==11.3.0 CairoSVG==2.8.2
      - name: Restore original lateral schematic and stage sourced 1875 rabbit dorsal brain
        run: python3 scripts/stage_historical_rabbit_brain.py
      - name: Check 64 figure assignments, source provenance and reviewer statuses
        run: bash scripts/qa_all.sh
      - name: Commit provisional source, complete rights ledger and image preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/pencil_plates/rabbit_brain_en.png
          git add app/src/main/assets/pencil_plates/manifest.json
          git add docs/figure-coverage.tsv docs/FIGURE_REVIEW_REGISTER_64.csv
          git add docs/qa-image-review/rabbit_brain_dorsal_comparison_review.png
          git add docs/CHORDATA_RABBIT_BRAIN_1875_QA.md
          if git diff --cached --quiet; then
            echo "Image current; no commit necessary"
          else
            git diff --cached --stat
            git commit -m "assets(qa): preserve original lateral rabbit brain and add public-domain 1875 dorsal view"
            git push origin HEAD:qa/chordata-rabbit-brain-20261107
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android API 37 SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          printf 'y\n' | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-37.0' 'build-tools;36.0.0'
          bash scripts/verify_sdk37_platform.sh
      - name: Compile Kotlin and build QA debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Validate packaged PNG hashes against exact figure manifest
        run: python3 scripts/audit_built_apk_assets.py app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Android QA APK (not production release)
        uses: actions/upload-artifact@v4
        with:
          name: Chordata_Historical_Rabbit_Brain_QA_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Archive provenance and visual quality candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Chordata_Historical_Rabbit_Brain_Review
          path: |
            docs/qa-image-review/rabbit_brain_dorsal_comparison_review.png
            docs/CHORDATA_RABBIT_BRAIN_1875_QA.md
          if-no-files-found: warn
          retention-days: 14
