name: CHORDATA Wave 2 Scoliodon morphology illustration — isolated QA
on:
  push:
    branches: ["qa/chordata-anatomy-visual-audit-wave2-20261107"]
    paths:
      - ".github/workflows/stage-scoliodon-wave2.yml"
      - "scripts/stage_historical_scoliodon_wave2.py"
      - "scripts/audit_figure_placement.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned raster processing dependency
        run: python3 -m pip install Pillow==11.3.0
      - name: Download original source and prepare the Scoliodon PNG
        run: python3 scripts/stage_historical_scoliodon_wave2.py
      - name: Audit all 64 figure slots and source integrity before commit
        run: bash scripts/qa_all.sh
      - name: Commit ONLY the provisional source image and credits
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/pencil_plates/scoliodon_external_anatomy_en.png
          git add app/src/main/assets/pencil_plates/manifest.json
          git add docs/figure-coverage.tsv docs/FIGURE_REVIEW_REGISTER_64.csv
          git add docs/CHORDATA_SCOLIODON_MULLER_HENLE_QA.md
          git add docs/qa-image-review/scoliodon_external_muller_henle_review.png
          if git diff --cached --quiet; then
            echo "Species drawing and provenance already current"
          else
            git diff --cached --stat
            git commit -m "assets(qa): replace Scoliodon polygon with 1838 species engraving"
            git push origin HEAD:qa/chordata-anatomy-visual-audit-wave2-20261107
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install Android API 37 for source compilation
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          printf 'y\n' | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-37.0' 'build-tools;36.0.0'
          bash scripts/verify_sdk37_platform.sh
      - name: Compile native Kotlin (no premature APK publication)
        run: gradle --no-daemon :app:compileDebugKotlin
      - name: Publish academic visual-review evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CHORDATA_Scoliodon_Wave2_Review
          path: |
            docs/qa-image-review/scoliodon_external_muller_henle_review.png
            docs/CHORDATA_SCOLIODON_MULLER_HENLE_QA.md
          if-no-files-found: warn
          retention-days: 14
