name: Finalise figure 49 lift-label legibility
on:
  push:
    branches:
      - qa/chordata-textbook-unit2-continuation-20261113
    paths:
      - .github/workflows/repair-figure49-lift.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  refine-aerofoil-figure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/qa/chordata-textbook-unit2-continuation-20261113'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic illustration renderer
        run: python -m pip install 'Pillow==11.3.0' 'CairoSVG==2.8.2'
      - name: Refine verified label legibility without modifying wing anatomy
        run: |
          set -euo pipefail
          python scripts/refine_figure49_legibility.py
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/audit_pencil_coverage.py')
          src=p.read_text(encoding='utf-8')
          before='SOURCE_LABEL_ERROR_CORRECTED_PENDING_INDEPENDENT_QA'
          after='SCIENTIFIC_LABEL_CORRECTED_LEGIBLE_QA_INDEPENDENT_REVIEW_PENDING'
          assert src.count(before)==1
          p.write_text(src.replace(before,after),encoding='utf-8')
          PY
          python scripts/write_figure_review_register.py
          python scripts/audit_pencil_coverage.py
          python scripts/audit_figure_placement.py
          python scripts/audit_textbook_chapters.py
          python scripts/test_review_signoff_guards.py
          python scripts/write_figure_review_register.py --check
          python scripts/check_textbook_plates.py
      - name: Commit final figure, SVG, new hashes and review register
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/original_plate_svg/avian_aerofoil_en.svg \
            app/src/main/assets/pencil_plates/avian_aerofoil_en.png \
            app/src/main/assets/pencil_plates/manifest.json \
            scripts/audit_pencil_coverage.py \
            docs/FIGURE_REVIEW_REGISTER_64.csv
          test -n "$(git diff --cached --name-only)"
          git commit -m 'figure(Aves): make corrected lift label legible while retaining unresolved academic review'
          git push origin "HEAD:refs/heads/qa/chordata-textbook-unit2-continuation-20261113"
          echo "Figure correction committed: $(git rev-parse HEAD)"
      - name: Start full QA for final figure commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-qa.yml --ref qa/chordata-textbook-unit2-continuation-20261113
