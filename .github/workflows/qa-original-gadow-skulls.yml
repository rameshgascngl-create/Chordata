name: CHORDATA QA - original 1901 skull temporal-fenestra plate
on:
  push:
    branches: ["qa/chordata-illustrations-continuous"]
    paths:
      - "scripts/install_original_gadow_skulls.py"
      - ".github/workflows/qa-original-gadow-skulls.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chordata-gadow-skull-source-intake
  cancel-in-progress: false
jobs:
  authenticate-and-integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install Pillow==11.3.0
      - name: Verify published 1901 skull plate and source integrity
        run: python3 scripts/install_original_gadow_skulls.py
      - name: All 64 science-figure placement, rights and offline-native QA checks
        run: bash scripts/qa_all.sh
      - name: Refresh 64-artwork provenance audit
        run: python3 scripts/report_artwork_provenance.py
      - name: Commit only documented original-skull figure assets to dedicated QA branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/pencil_plates/temporal_fenestrae.png
          git add app/src/main/assets/pencil_plates/manifest.json
          git add docs/figure-coverage.tsv docs/FIGURE_REVIEW_REGISTER_64.csv
          git add docs/CHORDATA_GADOW_1901_SKULL_TEMPORAL_ENGRAVING_QA.md
          git add docs/CHORDATA_ARTWORK_PROVENANCE_AUDIT_64.md
          if ! git diff --cached --quiet; then
            git diff --cached --stat
            git commit -m "assets(qa): replace schematic skull with published Gadow 1901 Fig 54 PNG"
            git fetch origin qa/chordata-illustrations-continuous
            git rebase origin/qa/chordata-illustrations-continuous
            git push origin HEAD:qa/chordata-illustrations-continuous
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Chordata_Gadow1901_Original_Skull_Plate_QA
          path: |
            app/src/main/assets/pencil_plates/temporal_fenestrae.png
            docs/CHORDATA_GADOW_1901_SKULL_TEMPORAL_ENGRAVING_QA.md
          if-no-files-found: warn
          retention-days: 14
