name: Chordata Native QA Debug APK
concurrency:
  group: chordata-qa-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: ["native/**", "qa/**"]
  pull_request:

jobs:
  prepare-figures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Prepare original provisional offline PNG plates without remote access
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 scripts/build_qa_plates.py
      - name: Upload provisional offline PNG assets
        uses: actions/upload-artifact@v4
        with:
          name: Chordata_QA_Source_Figures
          path: app/src/main/assets/figures/
          if-no-files-found: error
          retention-days: 7

  native-qa:
    needs: prepare-figures
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore identical QA figure assets
        uses: actions/download-artifact@v4
        with:
          name: Chordata_QA_Source_Figures
          path: app/src/main/assets/figures/
      - name: Audit all 64 figure-to-lesson assignments and verify PNG hashes
        run: python3 scripts/audit_figure_placement.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android SDK packages (hosted runner)
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          printf 'y\n' | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Compile native Kotlin before external figure acquisition
        run: gradle --no-daemon :app:compileDebugKotlin
      - name: Validate immutable content
        run: python3 scripts/audit_content.py
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Chordata_Native_QA_Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  android-instrumentation:
    needs: prepare-figures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore identical QA figure assets
        uses: actions/download-artifact@v4
        with:
          name: Chordata_QA_Source_Figures
          path: app/src/main/assets/figures/
      - name: Audit all 64 figure-to-lesson assignments and verify PNG hashes
        run: python3 scripts/audit_figure_placement.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android SDK packages (hosted runner)
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          printf 'y\n' | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Compile native Kotlin before external figure acquisition
        run: gradle --no-daemon :app:compileDebugKotlin
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=android_kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest
            mkdir -p build/qa-screenshots
            adb pull /sdcard/Pictures/ChordataQA build/qa-screenshots
      - name: Upload emulator screenshot and instrumented test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Chordata_Emulator_QA_Evidence
          path: |
            build/qa-screenshots/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 14
