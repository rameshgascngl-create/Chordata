name: Chordata Native QA Debug APK
concurrency:
  group: chordata-qa-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: ["native/**", "qa/**"]
  pull_request:

jobs:
  prepare-figures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify all 64 provisional plates, source hashes and lesson mapping
        run: |
          python3 scripts/audit_figure_placement.py
          python3 scripts/audit_pencil_coverage.py
          python3 scripts/audit_ai10_release_assets.py
          python3 scripts/test_monotreme_sourced_plate.py
          python3 scripts/test_aquatic_mammal_four_photo_plate.py
          python3 scripts/audit_coverage_report.py
          python3 scripts/audit_android_qa_contract.py
          python3 scripts/audit_store_preflight.py
          python3 scripts/audit_preview_bitmap_budget.py
          python3 scripts/audit_built_apk_assets.py --self-test
          python3 scripts/test_apk_source_fixture.py
          python3 scripts/write_figure_review_register.py --check
          python3 scripts/test_review_signoff_guards.py
          python3 scripts/test_sdk37_platform.py
          python3 scripts/test_git_sync_whitespace.py
      - name: Reject museum photographs and enforce exact line-art credit ownership
        run: python3 scripts/check_textbook_plates.py
      - name: Upload all offline QA figure assets and provenance metadata
        uses: actions/upload-artifact@v4
        with:
          name: Chordata_QA_Source_Figures
          path: |
            app/src/main/assets/figures/
            app/src/main/assets/pencil_plates/
            app/src/main/assets/figures.json
            app/src/main/assets/figure_slots.json
            app/src/main/assets/source_reference_credits.json
          if-no-files-found: error
          retention-days: 7

  native-qa:
    needs: prepare-figures
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore identical QA figure assets
        uses: actions/download-artifact@v4
        with:
          name: Chordata_QA_Source_Figures
          path: app/src/main/assets/
      - name: Audit all 64 registered pencil plates, placements and hashes
        run: |
          python3 scripts/audit_figure_placement.py
          python3 scripts/audit_pencil_coverage.py
          python3 scripts/audit_coverage_report.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android SDK packages (hosted runner)
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          printf 'y\n' | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-37.0' 'build-tools;36.0.0'
          bash scripts/verify_sdk37_platform.sh
      - name: Compile native Kotlin with validated offline figures
        run: gradle --no-daemon :app:compileDebugKotlin
      - name: Validate immutable content
        run: python3 scripts/audit_content.py
      - name: Validate production variant without creating a distributable release
        run: |
          # R8 and release resources often fail despite a green debug build.
          # This creates only an UNSIGNED test bundle; nothing is uploaded.
          gradle --no-daemon :app:bundleRelease :app:lintRelease
          test -f app/build/outputs/bundle/release/app-release.aab
          python3 scripts/audit_native_16kb.py app/build/outputs/bundle/release/app-release.aab
          python3 scripts/audit_store_preflight.py
      # An installable APK is NOT published here. Instrumentation runs in a
      # separate required job; publication only occurs once both gates pass.

  android-instrumentation:
    needs: prepare-figures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore identical QA figure assets
        uses: actions/download-artifact@v4
        with:
          name: Chordata_QA_Source_Figures
          path: app/src/main/assets/
      - name: Audit all 64 registered pencil plates, placements and hashes
        run: |
          python3 scripts/audit_figure_placement.py
          python3 scripts/audit_pencil_coverage.py
          python3 scripts/audit_coverage_report.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android SDK packages (hosted runner)
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          printf 'y\n' | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-37.0' 'build-tools;36.0.0'
          bash scripts/verify_sdk37_platform.sh
      - name: Compile native Kotlin with validated offline figures
        run: gradle --no-daemon :app:compileDebugKotlin
      - name: Restore persistent QA signing from encrypted repository secrets (optional)
        shell: bash
        env:
          QA_KEYSTORE_B64: ${{ secrets.CHORDATA_QA_KEYSTORE_B64 }}
          QA_STORE_PASSWORD: ${{ secrets.CHORDATA_QA_STORE_PASSWORD }}
          QA_KEY_ALIAS: ${{ secrets.CHORDATA_QA_KEY_ALIAS }}
          QA_KEY_PASSWORD: ${{ secrets.CHORDATA_QA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$QA_KEYSTORE_B64" && -z "$QA_STORE_PASSWORD" && -z "$QA_KEY_ALIAS" && -z "$QA_KEY_PASSWORD" ]]; then
            echo 'QA_SIGNING_MODE=ephemeral' >> "$GITHUB_ENV"
            echo '::warning::No persistent QA signing secrets: debug APK uses a new runner key and CANNOT upgrade an older differently signed QA APK.'
          elif [[ -z "$QA_KEYSTORE_B64" || -z "$QA_STORE_PASSWORD" || -z "$QA_KEY_ALIAS" || -z "$QA_KEY_PASSWORD" ]]; then
            echo '::error::Incomplete CHORDATA_QA signing secrets; configure all four or none.'
            exit 1
          else
            umask 077
            printf '%s' "$QA_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/chordata-qa.jks"
            printf 'CHORDATA_QA_KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/chordata-qa.jks" >> "$GITHUB_ENV"
            printf 'CHORDATA_QA_STORE_PASSWORD=%s\n' "$QA_STORE_PASSWORD" >> "$GITHUB_ENV"
            printf 'CHORDATA_QA_KEY_ALIAS=%s\n' "$QA_KEY_ALIAS" >> "$GITHUB_ENV"
            printf 'CHORDATA_QA_KEY_PASSWORD=%s\n' "$QA_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo 'QA_SIGNING_MODE=persistent' >> "$GITHUB_ENV"
            echo 'Persistent QA signing identity restored from encrypted secrets.'
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=android_kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          # Offline app requires no Google services. Stock AOSP avoids the
          # Pixel Launcher ANR dialogs observed in captured QA zoom screens.
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest
            python3 scripts/audit_built_apk_assets.py app/build/outputs/apk/debug/app-debug.apk
            python3 scripts/audit_native_16kb.py app/build/outputs/apk/debug/app-debug.apk
            # Exercise R8/minified QA on an actual running emulator, not just
            # a successful compilation. Install after the 33 debug UI tests.
            gradle --no-daemon :app:assembleCompactQa
            test -s app/build/outputs/apk/compactQa/app-compactQa.apk
            python3 scripts/audit_built_apk_assets.py app/build/outputs/apk/compactQa/app-compactQa.apk
            python3 scripts/audit_native_16kb.py app/build/outputs/apk/compactQa/app-compactQa.apk
            adb uninstall in.gasc.zoology.chordata >/dev/null || true
            adb install app/build/outputs/apk/compactQa/app-compactQa.apk
            adb shell am start -W -n in.gasc.zoology.chordata/.MainActivity
            sleep 3
            adb shell pidof in.gasc.zoology.chordata
            mkdir -p build/qa-screenshots
            adb pull /sdcard/Pictures/ChordataQA build/qa-screenshots
      - name: Upload emulator screenshot and instrumented test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Chordata_Emulator_QA_Evidence
          path: |
            build/qa-screenshots/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 14

  publish-tested-qa-apk:
    name: Publish QA APK only after native compilation and Android tests pass
    needs: [prepare-figures, native-qa, android-instrumentation]
    if: ${{ needs.native-qa.result == 'success' && needs.android-instrumentation.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact committed source and SHA
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Validated commit: $GITHUB_SHA"
      - name: Restore exact audited source figures
        uses: actions/download-artifact@v4
        with:
          name: Chordata_QA_Source_Figures
          path: app/src/main/assets/
      - name: Recheck 64 slots before final QA build
        run: |
          python3 scripts/audit_figure_placement.py
          python3 scripts/audit_pencil_coverage.py
          python3 scripts/audit_coverage_report.py
          python3 scripts/write_figure_review_register.py --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android SDK for validated QA assembly
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          printf 'y\n' | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-37.0' 'build-tools;36.0.0'
          bash scripts/verify_sdk37_platform.sh
      - name: Restore persistent QA signing from encrypted repository secrets (optional)
        shell: bash
        env:
          QA_KEYSTORE_B64: ${{ secrets.CHORDATA_QA_KEYSTORE_B64 }}
          QA_STORE_PASSWORD: ${{ secrets.CHORDATA_QA_STORE_PASSWORD }}
          QA_KEY_ALIAS: ${{ secrets.CHORDATA_QA_KEY_ALIAS }}
          QA_KEY_PASSWORD: ${{ secrets.CHORDATA_QA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$QA_KEYSTORE_B64" && -z "$QA_STORE_PASSWORD" && -z "$QA_KEY_ALIAS" && -z "$QA_KEY_PASSWORD" ]]; then
            echo 'QA_SIGNING_MODE=ephemeral' >> "$GITHUB_ENV"
            echo '::warning::No persistent QA signing secrets: debug APK uses a new runner key and CANNOT upgrade an older differently signed QA APK.'
          elif [[ -z "$QA_KEYSTORE_B64" || -z "$QA_STORE_PASSWORD" || -z "$QA_KEY_ALIAS" || -z "$QA_KEY_PASSWORD" ]]; then
            echo '::error::Incomplete CHORDATA_QA signing secrets; configure all four or none.'
            exit 1
          else
            umask 077
            printf '%s' "$QA_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/chordata-qa.jks"
            printf 'CHORDATA_QA_KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/chordata-qa.jks" >> "$GITHUB_ENV"
            printf 'CHORDATA_QA_STORE_PASSWORD=%s\n' "$QA_STORE_PASSWORD" >> "$GITHUB_ENV"
            printf 'CHORDATA_QA_KEY_ALIAS=%s\n' "$QA_KEY_ALIAS" >> "$GITHUB_ENV"
            printf 'CHORDATA_QA_KEY_PASSWORD=%s\n' "$QA_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo 'QA_SIGNING_MODE=persistent' >> "$GITHUB_ENV"
            echo 'Persistent QA signing identity restored from encrypted secrets.'
          fi
      - name: Build standard and compact QA APKs after all test gates pass
        run: gradle --no-daemon :app:assembleDebug :app:assembleCompactQa
      - name: Verify committed figure hashes and 16KiB native alignment inside gated APK
        run: |
          python3 scripts/audit_built_apk_assets.py app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/audit_native_16kb.py app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/audit_built_apk_assets.py app/build/outputs/apk/compactQa/app-compactQa.apk
          python3 scripts/audit_native_16kb.py app/build/outputs/apk/compactQa/app-compactQa.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/compactQa/app-compactQa.apk
          python3 - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          full = Path("app/build/outputs/apk/debug/app-debug.apk")
          compact = Path("app/build/outputs/apk/compactQa/app-compactQa.apk")
          with zipfile.ZipFile(full) as original, zipfile.ZipFile(compact) as reduced:
              assets = [n for n in original.namelist() if n.startswith("assets/") and not n.endswith("/")]
              reduced_assets = [n for n in reduced.namelist() if n.startswith("assets/") and not n.endswith("/")]
              assert set(assets) == set(reduced_assets), "Compressed QA build removed/added lesson or image assets"
              for name in assets:
                  assert hashlib.sha256(original.read(name)).digest() == hashlib.sha256(reduced.read(name)).digest(), f"Asset bytes changed: {name}"
          assert compact.stat().st_size < full.stat().st_size, "R8 build does not reduce installed APK size"
          print(f"PASS: {len(assets)} byte-identical assets; compact APK {compact.stat().st_size:,} versus {full.stat().st_size:,} bytes")
          PY
      - name: Report QA signing certificate without exposing a key
        shell: bash
        run: |
          set -euo pipefail
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$signer"
          cert_line="$("$signer" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep 'Signer #1 certificate SHA-256 digest:')"
          test -n "$cert_line"
          echo "QA signing mode: ${QA_SIGNING_MODE:-ephemeral}" >> "$GITHUB_STEP_SUMMARY"
          echo "$cert_line" >> "$GITHUB_STEP_SUMMARY"
          echo "$cert_line"
      - name: Publish gated Parker pigeon QA APK
        uses: actions/upload-artifact@v4
        with:
          name: Chordata_Parker_Pigeon_Tested_QA_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish byte-for-byte content-preserving compact QA APK
        uses: actions/upload-artifact@v4
        with:
          name: Chordata_Compact_QA_APK
          path: app/build/outputs/apk/compactQa/app-compactQa.apk
          if-no-files-found: error
          retention-days: 14
