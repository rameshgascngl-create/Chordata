name: Stage public-domain textbook anatomy plates
on:
  push:
    branches: ["native/qa-textbook-plates-20261106"]
    paths: [".github/workflows/stage-textbook-plates.yml","scripts/stage_historical_textbook_plates.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage-textbook-plates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==11.3.0
      - name: Retrieve public-domain original textbook illustrations and replace museum sources
        run: python scripts/stage_historical_textbook_plates.py
      - name: Run historical anatomy illustration and full 64-slot validation
        run: |
          python scripts/audit_figure_placement.py
          python scripts/check_textbook_plates.py
      - name: Commit vetted-source line drawings to QA branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/figures app/src/main/assets/figures.json app/src/main/assets/source_reference_credits.json
          git diff --cached --stat
          git diff --cached --quiet && { echo "Public-domain line drawings already staged; no new commit required"; exit 0; }
          git commit -m "assets(qa): replace museum skeleton photos with historical anatomy line plates"
          git push origin HEAD:native/qa-textbook-plates-20261106
      - name: Preserve lineage and source processing records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Chordata_Historical_Anatomy_Drawing_Evidence
          path: |
            app/src/main/assets/source_reference_credits.json
            app/src/main/assets/figures/source-hashes.json
          if-no-files-found: warn
          retention-days: 14
