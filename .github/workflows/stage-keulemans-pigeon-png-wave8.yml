name: CHORDATA Wave 8 — authentic Columba livia published plate to PNG (isolated QA)
on:
  push:
    branches: ["qa/chordata-authentic-pigeon-png-wave8-20261107"]
    paths:
      - "scripts/stage_keulemans_pigeon_png_wave8.py"
      - "scripts/audit_figure_placement.py"
      - ".github/workflows/stage-keulemans-pigeon-png-wave8.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-convert-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install Pillow==11.3.0
      - name: Source-authentic 1873 scan and pixel-preserving PNG conversion
        run: python3 scripts/stage_keulemans_pigeon_png_wave8.py
      - name: Audit all 64 registered figures, metadata, exact lesson mapping
        run: bash scripts/qa_all.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install Android API 37 for native Kotlin compilation
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          printf 'y\n' | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-37.0' 'build-tools;36.0.0'
          bash scripts/verify_sdk37_platform.sh
      - name: Compile Kotlin against verified original pigeon PNG
        run: gradle --no-daemon :app:compileDebugKotlin
      - name: Commit only original published art, provenance and review reset
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/pencil_plates/pigeon_external_anatomy_en.png
          git add app/src/main/assets/pencil_plates/manifest.json
          git add docs/figure-coverage.tsv docs/FIGURE_REVIEW_REGISTER_64.csv
          git add docs/CHORDATA_KEULEMANS_1873_ROCK_PIGEON_PNG_QA.md
          if ! git diff --cached --quiet; then
            git diff --cached --stat
            git commit -m "assets(qa): replace synthetic rock pigeon with original Keulemans 1873 PNG"
            git push origin HEAD:qa/chordata-authentic-pigeon-png-wave8-20261107
          fi
      - name: Publish independent scientific review source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Chordata_Keulemans_1873_Rock_Pigeon_PNG_Review
          path: |
            app/src/main/assets/pencil_plates/pigeon_external_anatomy_en.png
            docs/CHORDATA_KEULEMANS_1873_ROCK_PIGEON_PNG_QA.md
          if-no-files-found: warn
          retention-days: 14
