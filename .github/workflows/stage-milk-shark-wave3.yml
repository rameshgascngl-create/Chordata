name: CHORDATA Wave 3 — corrected milk shark Ruppell historical illustration
on:
  push:
    branches: ["qa/chordata-milk-shark-taxonomy-fix-20261107"]
    paths:
      - "scripts/stage_ruppell_milk_shark_wave3.py"
      - ".github/workflows/stage-milk-shark-wave3.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage-and-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned image processing
        run: python3 -m pip install Pillow==11.3.0
      - name: Download PD Ruppell original and isolate ONLY figure four
        run: python3 scripts/stage_ruppell_milk_shark_wave3.py
      - name: Audit 64 images, source hashes, scientific-credit registry
        run: bash scripts/qa_all.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install Android API 37 for Kotlin compile gate
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          printf 'y\n' | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-37.0' 'build-tools;36.0.0'
          bash scripts/verify_sdk37_platform.sh
      - name: Compile native Kotlin before committing artwork
        run: gradle --no-daemon :app:compileDebugKotlin
      - name: Commit only replacement plate, provenance and reviewer reset
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/pencil_plates/scoliodon_external_anatomy_en.png
          git add app/src/main/assets/pencil_plates/manifest.json
          git add docs/figure-coverage.tsv docs/FIGURE_REVIEW_REGISTER_64.csv
          git add docs/CHORDATA_RUPPELL_MILK_SHARK_QA.md
          git add docs/qa-image-review/ruppell_milk_shark_fig4_review.png
          if ! git diff --cached --quiet; then
            git diff --cached --stat
            git commit -m "fix(qa): replace wrong spadenose shark with Ruppell milk shark figure"
            git push origin HEAD:qa/chordata-milk-shark-taxonomy-fix-20261107
          else
            echo "Correct milk shark provenance and image already staged"
          fi
      - name: Upload science review preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Chordata_Milk_Shark_Ruppell_Fig4_Review
          path: |
            docs/qa-image-review/ruppell_milk_shark_fig4_review.png
            docs/CHORDATA_RUPPELL_MILK_SHARK_QA.md
          if-no-files-found: warn
          retention-days: 14
