name: CHORDATA three classroom figure replacements
on:
  push:
    branches:
      - qa/chordata-pedagogical-figure-replacements-20261112
    paths:
      - scripts/stage_three_classroom_figures_20261112.py
      - .github/workflows/stage-three-classroom-figures.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install-sourced-plates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Pillow for image composition
        run: python -m pip install Pillow==11.3.0
      - name: Build source-attributed plate replacements
        run: python scripts/stage_three_classroom_figures_20261112.py
      - name: Regenerate 64-slot scientific signoff ledger without approving images
        run: python scripts/write_figure_review_register.py
      - name: Validate page registration, source hashes, binaries and no data loss
        run: |
          python scripts/audit_figure_placement.py
          python scripts/audit_pencil_coverage.py
          python scripts/check_textbook_plates.py
          python scripts/write_figure_review_register.py --check
      - name: Save image assets, source records and original archives on QA branch
        run: |
          if [ -f docs/qa-image-review/THREE_CLASSROOM_FIGURES_REPLACED_20261112.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/assets/pencil_plates/manifest.json
            git add app/src/main/assets/pencil_plates/scoliodon_digestive_en.png
            git add app/src/main/assets/pencil_plates/fish_scale_types.png
            git add app/src/main/assets/pencil_plates/devonian_tetrapod_transition_en.png
            git add docs/retired_noninstructional_png/ docs/FIGURE_REVIEW_REGISTER_64.csv
            git add docs/qa-image-review/THREE_CLASSROOM_FIGURES_REPLACED_20261112.json
            if ! git diff --cached --quiet; then
              git commit -m "feat(qa): install three licensed teaching PNGs and preserve old artwork"
              git push origin HEAD:qa/chordata-pedagogical-figure-replacements-20261112
            fi
          fi
