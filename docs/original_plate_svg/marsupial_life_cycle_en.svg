<svg baseProfile="full" height="1120" version="1.1" viewBox="0 0 1800 1120" width="1800" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="1120" width="1800" x="0" y="0" /><text fill="#25363f" font-family="DejaVu Sans" font-size="62" font-weight="bold" text-anchor="start" x="75" y="91">Marsupial reproduction: life-history stages</text><text fill="#687b83" font-family="DejaVu Sans" font-size="28" font-weight="normal" text-anchor="start" x="79" y="138">Short gestation and development after birth; not all species have a permanent pouch</text><line stroke="#31647a" stroke-linecap="round" stroke-width="4" x1="75" x2="1725" y1="170" y2="170" /><text fill="#687b83" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="start" x="77" y="1080">ORIGINAL SCHEMATIC  /  NOT TO SCALE  /  ACADEMIC REVIEW PENDING</text><rect fill="#f1f6f4" height="350" rx="22" ry="22" stroke="#bdcfcc" stroke-width="3" width="819" x="70" y="222" /><text fill="#25363f" font-family="DejaVu Sans" font-size="28" font-weight="bold" text-anchor="start" x="96" y="272">MATERNAL GESTATION</text><text fill="#687b83" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" x="102" y="337">Develops in uterus</text><ellipse cx="510" cy="454" fill="#e2ece8" rx="91" ry="64" stroke="#25363f" stroke-width="4" /><line stroke="#31647a" stroke-linecap="round" stroke-width="5" x1="870" x2="928" y1="489" y2="489" /><polygon fill="#31647a" points="928,489 912.0340913899729,497.31202515974667 912.0340913899729,480.68797484025333" stroke="#31647a" stroke-linejoin="round" stroke-width="1" /><rect fill="#f1f6f4" height="350" rx="22" ry="22" stroke="#bdcfcc" stroke-width="3" width="819" x="932" y="222" /><text fill="#25363f" font-family="DejaVu Sans" font-size="28" font-weight="bold" text-anchor="start" x="958" y="272">EARLY BIRTH</text><text fill="#687b83" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" x="964" y="337">Small underdeveloped young</text><ellipse cx="1358" cy="441" fill="#e2ece8" rx="55" ry="37" stroke="#25363f" stroke-width="4" /><path d="M 1385 464 Q 1452 520 1401 534" fill="none" stroke="#25363f" stroke-linecap="round" stroke-linejoin="round" stroke-width="12" /><rect fill="#f1f6f4" height="350" rx="22" ry="22" stroke="#bdcfcc" stroke-width="3" width="819" x="70" y="610" /><text fill="#25363f" font-family="DejaVu Sans" font-size="28" font-weight="bold" text-anchor="start" x="96" y="660">TEAT ATTACHMENT</text><text fill="#687b83" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" x="102" y="725">Milk-fuelled development</text><path d="M 423 883 Q 497 748 601 883" fill="none" stroke="#25363f" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><ellipse cx="509" cy="860" fill="#e2ece8" rx="53" ry="37" stroke="#25363f" stroke-width="4" /><circle cx="510" cy="826" fill="#ead5cc" r="14" stroke="#b55e4f" stroke-width="4" /><line stroke="#31647a" stroke-linecap="round" stroke-width="5" x1="870" x2="928" y1="877" y2="877" /><polygon fill="#31647a" points="928,877 912.0340913899729,885.3120251597467 912.0340913899729,868.6879748402533" stroke="#31647a" stroke-linejoin="round" stroke-width="1" /><rect fill="#f1f6f4" height="350" rx="22" ry="22" stroke="#bdcfcc" stroke-width="3" width="819" x="932" y="610" /><text fill="#25363f" font-family="DejaVu Sans" font-size="28" font-weight="bold" text-anchor="start" x="958" y="660">JUVENILE</text><text fill="#687b83" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" x="964" y="725">Growth beyond teat attachment</text><ellipse cx="1363" cy="824" fill="#e2ece8" rx="95" ry="74" stroke="#25363f" stroke-width="4" /><circle cx="1286" cy="767" fill="#e2ece8" r="39" stroke="#25363f" stroke-width="4" /><text fill="#687b83" font-family="DejaVu Sans" font-size="23" font-weight="normal" text-anchor="start" x="217" y="1035">Pouch presence and form vary widely; many marsupials form a placenta of some kind.</text></svg>