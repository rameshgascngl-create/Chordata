<text x="1975" y="1419" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="700" fill="#1d3949" text-anchor="start">C  TRACT &amp; GLAND CONNECTIONS</text>
<text x="1985" y="1493" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#1d3949" text-anchor="start">1  Mouth → oesophagus → cardiac stomach</text>
