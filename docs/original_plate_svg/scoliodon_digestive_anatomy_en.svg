<text x="1985" y="1744" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#627f61" text-anchor="start">Liver / gallbladder → bile duct → proximal intestine</text>
<text x="1985" y="1800" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#b58b50" text-anchor="start">Pancreas → pancreatic duct → proximal intestine</text>
<text x="1985" y="1855" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#bc6563" text-anchor="start">Rectal gland opens into rectum; excretes excess salt.</text>
<text x="1970" y="2007" font-family="DejaVu Sans, sans-serif" font-size="37" font-weight="700" fill="#1d3949" text-anchor="start">D  IMPORTANT SCIENTIFIC DISTINCTIONS</text>
