<svg baseProfile="full" height="1120" version="1.1" viewBox="0 0 1800 1120" width="1800" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="1120" width="1800" x="0" y="0" /><text fill="#25363f" font-family="DejaVu Sans" font-size="62" font-weight="bold" text-anchor="start" x="75" y="91">Living bird lineages</text><text fill="#687b83" font-family="DejaVu Sans" font-size="28" font-weight="normal" text-anchor="start" x="79" y="138">A major split among modern birds; simplified lineage diagram</text><line stroke="#31647a" stroke-linecap="round" stroke-width="4" x1="75" x2="1725" y1="170" y2="170" /><text fill="#687b83" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="start" x="77" y="1080">ORIGINAL SCHEMATIC  /  NOT TO SCALE  /  ACADEMIC REVIEW PENDING</text><rect fill="#f1f6f4" height="751" rx="22" ry="22" stroke="#bdcfcc" stroke-width="3" width="1597" x="105" y="236" /><text fill="#25363f" font-family="DejaVu Sans" font-size="28" font-weight="bold" text-anchor="start" x="131" y="286">NEORNITHES — LIVING BIRDS</text><line stroke="#31647a" stroke-linecap="round" stroke-width="11" x1="292" x2="292" y1="395" y2="783" /><line stroke="#31647a" stroke-linecap="round" stroke-width="9" x1="294" x2="550" y1="445" y2="445" /><rect fill="#f1f6f4" height="168" rx="22" ry="22" stroke="#bdcfcc" stroke-width="3" width="962" x="577" y="365" /><text fill="#25363f" font-family="DejaVu Sans" font-size="28" font-weight="bold" text-anchor="start" x="603" y="415">PALAEOGNATHAE</text><text fill="#687b83" font-family="DejaVu Sans" font-size="26" font-weight="normal" text-anchor="start" x="626" y="469">Ostriches, emus and tinamous</text><line stroke="#31647a" stroke-linecap="round" stroke-width="9" x1="294" x2="550" y1="693" y2="693" /><rect fill="#f1f6f4" height="168" rx="22" ry="22" stroke="#bdcfcc" stroke-width="3" width="962" x="577" y="613" /><text fill="#25363f" font-family="DejaVu Sans" font-size="28" font-weight="bold" text-anchor="start" x="603" y="663">NEOGNATHAE</text><text fill="#687b83" font-family="DejaVu Sans" font-size="26" font-weight="normal" text-anchor="start" x="626" y="717">Most other living birds</text><text fill="#687b83" font-family="DejaVu Sans" font-size="27" font-weight="normal" text-anchor="start" x="298" y="970">Flight ability does not define Palaeognathae: tinamous can fly.</text></svg>