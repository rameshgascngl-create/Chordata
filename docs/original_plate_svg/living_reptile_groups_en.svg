<svg baseProfile="full" height="1120" version="1.1" viewBox="0 0 1800 1120" width="1800" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="1120" width="1800" x="0" y="0" /><text fill="#25363f" font-family="DejaVu Sans" font-size="62" font-weight="bold" text-anchor="start" x="75" y="91">Living reptiles: important evolutionary groups</text><text fill="#687b83" font-family="DejaVu Sans" font-size="28" font-weight="normal" text-anchor="start" x="79" y="138">Conventional named orders within modern sauropsid diversity</text><line stroke="#31647a" stroke-linecap="round" stroke-width="4" x1="75" x2="1725" y1="170" y2="170" /><text fill="#687b83" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="start" x="77" y="1080">ORIGINAL SCHEMATIC  /  NOT TO SCALE  /  ACADEMIC REVIEW PENDING</text><rect fill="#f1f6f4" height="770" rx="22" ry="22" stroke="#bdcfcc" stroke-width="3" width="1605" x="94" y="222" /><text fill="#25363f" font-family="DejaVu Sans" font-size="28" font-weight="bold" text-anchor="start" x="120" y="272">LIVING SAUROPSID LINEAGES — illustrative topology</text><line stroke="#31647a" stroke-linecap="round" stroke-width="12" x1="250" x2="250" y1="349" y2="850" /><line stroke="#31647a" stroke-linecap="round" stroke-width="9" x1="250" x2="585" y1="388" y2="388" /><circle cx="586" cy="388" fill="#31647a" r="11" stroke="#31647a" stroke-width="1" /><rect fill="#f1f6f4" height="124" rx="22" ry="22" stroke="#bdcfcc" stroke-width="3" width="912" x="620" y="330" /><text fill="#25363f" font-family="DejaVu Sans" font-size="33" font-weight="bold" text-anchor="start" x="662" y="380">Testudines</text><text fill="#25363f" font-family="DejaVu Sans" font-size="27" font-weight="normal" text-anchor="start" x="1000" y="380">Turtles + tortoises</text><line stroke="#31647a" stroke-linecap="round" stroke-width="9" x1="250" x2="585" y1="593" y2="593" /><circle cx="586" cy="593" fill="#31647a" r="11" stroke="#31647a" stroke-width="1" /><rect fill="#f1f6f4" height="124" rx="22" ry="22" stroke="#bdcfcc" stroke-width="3" width="912" x="620" y="535" /><text fill="#25363f" font-family="DejaVu Sans" font-size="33" font-weight="bold" text-anchor="start" x="662" y="585">Lepidosauria</text><text fill="#25363f" font-family="DejaVu Sans" font-size="27" font-weight="normal" text-anchor="start" x="1000" y="585">Squamata + Rhynchocephalia</text><line stroke="#31647a" stroke-linecap="round" stroke-width="9" x1="250" x2="585" y1="798" y2="798" /><circle cx="586" cy="798" fill="#31647a" r="11" stroke="#31647a" stroke-width="1" /><rect fill="#f1f6f4" height="124" rx="22" ry="22" stroke="#bdcfcc" stroke-width="3" width="912" x="620" y="740" /><text fill="#25363f" font-family="DejaVu Sans" font-size="33" font-weight="bold" text-anchor="start" x="662" y="790">Archosauria</text><text fill="#25363f" font-family="DejaVu Sans" font-size="27" font-weight="normal" text-anchor="start" x="1000" y="790">Crocodilians + birds</text><text fill="#687b83" font-family="DejaVu Sans" font-size="24" font-weight="normal" text-anchor="start" x="170" y="1020">“Traditional reptiles” omit birds; in phylogenetic classification birds belong within reptiles.</text></svg>