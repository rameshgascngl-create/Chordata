<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1120" version="1.1" viewBox="0 0 1800 1120" width="1800" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="1120" width="1800" x="0" y="0" /><text fill="#25363f" font-family="DejaVu Sans" font-size="62" font-weight="bold" text-anchor="start" x="75" y="91">Snakebite: evidence-based first aid</text><text fill="#687b83" font-family="DejaVu Sans" font-size="28" font-weight="normal" text-anchor="start" x="79" y="138">WHO / Indian public-health recommendations — emergency care required</text><line stroke="#31647a" stroke-linecap="round" stroke-width="4" x1="75" x2="1725" y1="170" y2="170" /><text fill="#687b83" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="start" x="77" y="1080">ORIGINAL SCHEMATIC  /  NOT TO SCALE  /  ACADEMIC REVIEW PENDING</text><rect fill="#f1f6f4" height="103" rx="22" ry="22" stroke="#bdcfcc" stroke-width="3" width="1566" x="117" y="226" /><text fill="#31647a" font-family="DejaVu Sans" font-size="29" font-weight="bold" text-anchor="start" x="154" y="269">1  MOVE AWAY</text><text fill="#25363f" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" x="617" y="270">Leave the snake; do not try to catch it.</text><line stroke="#608a80" stroke-linecap="round" stroke-width="4" x1="915" x2="915" y1="322" y2="339" /><polygon fill="#608a80" points="915,339 906.6879748402533,323.0340913899729 923.3120251597467,323.0340913899729" stroke="#608a80" stroke-linejoin="round" stroke-width="1" /><rect fill="#ffffff" height="103" rx="22" ry="22" stroke="#bdcfcc" stroke-width="3" width="1566" x="117" y="342" /><text fill="#31647a" font-family="DejaVu Sans" font-size="29" font-weight="bold" text-anchor="start" x="154" y="385">2  CALL EMERGENCY CARE</text><text fill="#25363f" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" x="617" y="386">Arrange rapid transfer to a hospital.</text><line stroke="#608a80" stroke-linecap="round" stroke-width="4" x1="915" x2="915" y1="438" y2="455" /><polygon fill="#608a80" points="915,455 906.6879748402533,439.0340913899729 923.3120251597467,439.0340913899729" stroke="#608a80" stroke-linejoin="round" stroke-width="1" /><rect fill="#f1f6f4" height="103" rx="22" ry="22" stroke="#bdcfcc" stroke-width="3" width="1566" x="117" y="458" /><text fill="#31647a" font-family="DejaVu Sans" font-size="29" font-weight="bold" text-anchor="start" x="154" y="501">3  KEEP PERSON STILL</text><text fill="#25363f" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" x="617" y="502">Reassure; avoid walking and exertion.</text><line stroke="#608a80" stroke-linecap="round" stroke-width="4" x1="915" x2="915" y1="554" y2="571" /><polygon fill="#608a80" points="915,571 906.6879748402533,555.0340913899729 923.3120251597467,555.0340913899729" stroke="#608a80" stroke-linejoin="round" stroke-width="1" /><rect fill="#ffffff" height="103" rx="22" ry="22" stroke="#bdcfcc" stroke-width="3" width="1566" x="117" y="574" /><text fill="#31647a" font-family="DejaVu Sans" font-size="29" font-weight="bold" text-anchor="start" x="154" y="617">4  IMMOBILISE LIMB</text><text fill="#25363f" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" x="617" y="618">Support limb with a splint, without constriction.</text><line stroke="#608a80" stroke-linecap="round" stroke-width="4" x1="915" x2="915" y1="670" y2="687" /><polygon fill="#608a80" points="915,687 906.6879748402533,671.0340913899729 923.3120251597467,671.0340913899729" stroke="#608a80" stroke-linejoin="round" stroke-width="1" /><rect fill="#f1f6f4" height="103" rx="22" ry="22" stroke="#bdcfcc" stroke-width="3" width="1566" x="117" y="690" /><text fill="#31647a" font-family="DejaVu Sans" font-size="29" font-weight="bold" text-anchor="start" x="154" y="733">5  REMOVE TIGHT ITEMS</text><text fill="#25363f" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" x="617" y="734">Remove rings, anklets, watches before swelling.</text><line stroke="#608a80" stroke-linecap="round" stroke-width="4" x1="915" x2="915" y1="786" y2="803" /><polygon fill="#608a80" points="915,803 906.6879748402533,787.0340913899729 923.3120251597467,787.0340913899729" stroke="#608a80" stroke-linejoin="round" stroke-width="1" /><rect fill="#ffffff" height="103" rx="22" ry="22" stroke="#bdcfcc" stroke-width="3" width="1566" x="117" y="806" /><text fill="#31647a" font-family="DejaVu Sans" font-size="29" font-weight="bold" text-anchor="start" x="154" y="849">6  MONITOR + TRANSPORT</text><text fill="#25363f" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" x="617" y="850">Observe breathing; hand over to medical team.</text><rect fill="#fff4f0" height="80" rx="22" ry="22" stroke="#bdcfcc" stroke-width="3" width="1560" x="120" y="948" /><text fill="#b55e4f" font-family="DejaVu Sans" font-size="27" font-weight="bold" text-anchor="start" x="172" y="1003">AVOID: TOURNIQUET · CUTTING · SUCTION · ICE · HERBAL REMEDIES · DELAY</text></svg>