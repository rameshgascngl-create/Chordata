<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1120" version="1.1" viewBox="0 0 1800 1120" width="1800" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="1120" width="1800" x="0" y="0" /><text fill="#25363f" font-family="DejaVu Sans" font-size="62" font-weight="bold" text-anchor="start" x="75" y="91">Living mammals: evolutionary lineages</text><text fill="#687b83" font-family="DejaVu Sans" font-size="28" font-weight="normal" text-anchor="start" x="79" y="138">Monotremata and the two major therian lineages</text><line stroke="#31647a" stroke-linecap="round" stroke-width="4" x1="75" x2="1725" y1="170" y2="170" /><text fill="#687b83" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="start" x="77" y="1080">ORIGINAL SCHEMATIC  /  NOT TO SCALE  /  ACADEMIC REVIEW PENDING</text><rect fill="#f1f6f4" height="742" rx="22" ry="22" stroke="#bdcfcc" stroke-width="3" width="1576" x="111" y="230" /><text fill="#25363f" font-family="DejaVu Sans" font-size="28" font-weight="bold" text-anchor="start" x="137" y="280">THERIA AND MONOTREMATA — LIVING MAMMALS</text><text fill="#31647a" font-family="DejaVu Sans" font-size="44" font-weight="bold" text-anchor="start" x="214" y="389">MAMMALIA</text><line stroke="#31647a" stroke-linecap="round" stroke-width="10" x1="410" x2="411" y1="425" y2="819" /><line stroke="#31647a" stroke-linecap="round" stroke-width="8" x1="411" x2="571" y1="493" y2="493" /><rect fill="#f1f6f4" height="130" rx="22" ry="22" stroke="#bdcfcc" stroke-width="3" width="920" x="599" y="427" /><text fill="#25363f" font-family="DejaVu Sans" font-size="28" font-weight="bold" text-anchor="start" x="625" y="477">MONOTREMATA  — egg laying</text><line stroke="#31647a" stroke-linecap="round" stroke-width="8" x1="411" x2="509" y1="657" y2="657" /><text fill="#31647a" font-family="DejaVu Sans" font-size="34" font-weight="bold" text-anchor="start" x="521" y="666">THERIA</text><line stroke="#31647a" stroke-linecap="round" stroke-width="8" x1="674" x2="674" y1="657" y2="847" /><line stroke="#31647a" stroke-linecap="round" stroke-width="7" x1="674" x2="762" y1="729" y2="729" /><rect fill="#f1f6f4" height="112" rx="22" ry="22" stroke="#bdcfcc" stroke-width="3" width="738" x="775" y="673" /><text fill="#25363f" font-family="DejaVu Sans" font-size="28" font-weight="bold" text-anchor="start" x="801" y="723">MARSUPIALIA  — short gestation / teat</text><line stroke="#31647a" stroke-linecap="round" stroke-width="7" x1="674" x2="762" y1="848" y2="848" /><rect fill="#f1f6f4" height="112" rx="22" ry="22" stroke="#bdcfcc" stroke-width="3" width="738" x="775" y="792" /><text fill="#25363f" font-family="DejaVu Sans" font-size="28" font-weight="bold" text-anchor="start" x="801" y="842">PLACENTALIA  — diverse placentas</text><text fill="#687b83" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" x="177" y="1018">The diagram is branching, not a sequence from “lower” to “higher” mammals.</text></svg>